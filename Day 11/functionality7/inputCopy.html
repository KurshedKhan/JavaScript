<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input Copy Text</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body{
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: rgb(196, 194, 194);
    } 

    .container{
      box-shadow: 0px 4px 9px rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 4px;
      background-color: white;
      text-align: justify;
    }
    input[type="text"]{
      border: 1px solid rgba(128, 128, 128, 0.632);
      outline: none;
      width: 80%;
      padding: 10px;
      border-radius: 5px;
    }
    .p1{
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Text Copy Clipboard</h2>
    <input type="text" id="inputText" placeholder="Enter your copy text...">
    <p class="p1" id="copyText"><i class="bi bi-copy"></i></p>
  </div>
  <script src="inputCopy.js"></script>
</body>
</html>
