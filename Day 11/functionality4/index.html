<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup box show and hide</title>
  <style>
    .btn{
      padding: 10px 20px;
      background-color: black;
      color: white;
      border: 1px solid black;
      outline: none;
      cursor: pointer;
      border-radius: 5px;
      float: right;
    }
    .btn:hover{
      background-color: white;
      color: black;
    }
    .model{
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50% , -50%);
      box-shadow: 3px 3px 9px black;
      border-radius: 10px;
    }
    .modelchange{
      display: block;
    }
    .signup-form {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 300px;
    }

    .signup-form h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .signup-form input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .signup-form button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-form button:hover {
      background-color: #45a049;
    }
    .close{
      border: 2px solid black;
      position: absolute;
      top: -5px;
      right: 20px;
      height: 30px;
      width: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }
    .close:hover{
      background-color: black;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button type="button" id="btn" class="btn">Sign In</button>
  <div id="model" class="model">
    <p id="close" class="close">&times;</p>
    <form class="signup-form">
      <h2>Sign Up</h2>
      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <input type="password" placeholder="Confirm Password" required />
      <button type="submit">Register</button>
    </form>
  </div>
  <script src="index.js"></script>
</body>
</html>
