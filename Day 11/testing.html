<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      list-style-type: none;
      text-decoration: none;
  }
  body{
      background-color: rgb(211, 206, 206);
      font-family: Arial, Helvetica, sans-serif;
      padding: 2rem;
  }
  .container{
      width: 600px;
      margin: 0 auto;
      padding: 1rem;
      background-color: rgba(255, 255, 255, 0.926);
      box-shadow: 0px 0px 10px rgb(136, 135, 135);
      border-radius: 0.4rem;
  }
  h2{
      text-align: center;
  }
  .todo-input{
      display: flex;
      margin-bottom: 2rem;
      padding: 1rem;
  }
  .todo-input input{
      border: 1px solid rgb(236, 232, 232);
      padding: 0.5rem 1rem;
      font-size: 1rem;
      flex: 1;
      border-radius: 0.3rem;
  }
  .todo-input button{
      padding: 0.3rem 1rem;
      margin-left: 0.5rem;
      border: none;
      outline: none;
      background-color: rgb(6, 179, 6);
      color: white;
      border-radius: 0.3rem;
  }
  </style>
</head>
<body>
  <div class="container">
    <h2>To Do List</h2>
    <div class="todo-input">
    <input type="text" id="inputText" placeholder="Enter yor task">
    <button type="button" id="show-btn">add</button>
    </div>
    <ul class="task-list">
     
    </ul>
 </div>

  <script>
    let button = document.getElementById("show-btn");
    let inputText = document.getElementById("inputText");

let tasks = [];

button.addEventListener("click", addTask);

function addTask(){
    let text = inputText.value.trim();
    console.log(text);
    if(text === ""){
        alert("please enter your value");
    }
    else{
        tasks.push(text);
        inputText.value = "";
    }
}
  </script>
</body>
</html>
