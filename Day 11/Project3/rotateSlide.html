<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infinite Carousel</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    .carousel-container {
      position: relative;
      width: 80%;
      max-width: 800px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .carousel-slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      min-width: 100%;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      color: white;
    }

    .slide:nth-child(1) { background: #20b2aa; } /* Clone of last */
    .slide:nth-child(2) { background: #ff6f61; }
    .slide:nth-child(3) { background: #6a67ce; }
    .slide:nth-child(4) { background: #20b2aa; }
    .slide:nth-child(5) { background: #ff6f61; } /* Clone of first */

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      font-size: 2em;
      cursor: pointer;
      padding: 0 15px;
      border-radius: 50%;
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    .dots {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
    }

    .dot {
      display: inline-block;
      height: 12px;
      width: 12px;
      margin: 0 4px;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      cursor: pointer;
    }

    .dot.active {
      background-color: white;
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel-slides" id="carouselSlides">
      <div class="slide">Slide 3</div> <!-- Clone of last -->
      <div class="slide">Slide 1</div>
      <div class="slide">Slide 2</div>
      <div class="slide">Slide 3</div>
      <div class="slide">Slide 1</div> <!-- Clone of first -->
    </div>

    <button class="btn prev" onclick="prevSlide()">❮</button>
    <button class="btn next" onclick="nextSlide()">❯</button>

    <div class="dots" id="dots"></div>
  </div>

  <script>
    const carousel = document.getElementById("carouselSlides");
    const totalSlides = 3; // only real slides
    const dotsContainer = document.getElementById("dots");

    let slideIndex = 1;
    let isTransitioning = false;
    let autoPlayInterval;

    function setSlide(index, withTransition = true) {
      if (withTransition) {
        carousel.style.transition = 'transform 0.5s ease-in-out';
      } else {
        carousel.style.transition = 'none';
      }
      carousel.style.transform = `translateX(-${index * 100}%)`;
    }

    function showSlide(index) {
      if (isTransitioning) return;
      isTransitioning = true;
      slideIndex = index;
      setSlide(slideIndex);
    }

    function nextSlide() {
      showSlide(slideIndex + 1);
    }

    function prevSlide() {
      showSlide(slideIndex - 1);
    }

    function createDots() {
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement("span");
        dot.classList.add("dot");
        if (i === 0) dot.classList.add("active");
        dot.addEventListener("click", () => {
          showSlide(i + 1); // offset for clone
        });
        dotsContainer.appendChild(dot);
      }
    }

    function updateDots() {
      const dots = document.querySelectorAll(".dot");
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === slideIndex - 1);
      });
    }

    carousel.addEventListener("transitionend", () => {
      if (slideIndex === 0) {
        slideIndex = totalSlides;
        setSlide(slideIndex, false);
      } else if (slideIndex === totalSlides + 1) {
        slideIndex = 1;
        setSlide(slideIndex, false);
      }
      updateDots();
      isTransitioning = false;
    });

    function startAutoplay() {
      autoPlayInterval = setInterval(nextSlide, 3000);
    }

    function stopAutoplay() {
      clearInterval(autoPlayInterval);
    }

    document.querySelector(".carousel-container").addEventListener("mouseenter", stopAutoplay);
    document.querySelector(".carousel-container").addEventListener("mouseleave", startAutoplay);

    // Initialize
    setSlide(slideIndex, false);
    createDots();
    updateDots();
    startAutoplay();
  </script>

</body>
</html>
